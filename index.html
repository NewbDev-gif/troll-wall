<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SYSTEM BREACH: NOWIE VAULT</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #000;
            color: #ff007f;
            font-family: "Courier New", monospace;
        }

        body {
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff007f;
            border-radius: 10px;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        header {
            width: 100%;
            background: #000;
            border-bottom: 3px solid #ff007f;
            text-align: center;
            padding: 30px 15px 28px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
        }

        header h1 {
            margin: 0;
            color: #ff007f;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            letter-spacing: 5px;
            text-shadow:
                2px 2px 0 #fff,
                0 0 8px rgba(255, 0, 127, 0.5);
        }

        header span {
            display: block;
            margin-top: 12px;
            color: #00ff41;
            font-weight: bold;
            font-size: clamp(0.7rem, 2vw, 0.95rem);
            letter-spacing: 1px;
        }

        /* =========================================================
           UPLOAD BUTTON
        ========================================================= */

        .upload-area {
            background: #050505;
            border-bottom: 1px solid #222;
            padding: 14px;
            text-align: center;
        }

        #uploadButton {
            background: #ff007f;
            color: #000;
            border: 2px solid #ff007f;
            padding: 12px 22px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s ease, color 0.15s ease;
        }

        #uploadButton:hover {
            background: #000;
            color: #ff007f;
        }

        #uploadButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================================================
           STATUS
        ========================================================= */

        #status {
            min-height: 32px;
            padding: 10px 15px;
            text-align: center;
            background: #050505;
            color: #00ff41;
            font-size: 0.75rem;
            border-bottom: 1px solid #222;
        }

        #status.error {
            color: #ff3333;
        }

        /* =========================================================
           MEDIA WALL
        ========================================================= */

        #wall-container {
            width: 100%;
            background: #ff007f;
            padding: 8px;
        }

        /*
            CSS GRID + JAVASCRIPT ROW SPANS

            This gives us a proper masonry layout.

            Unlike ordinary CSS columns, this prevents the large
            unwanted spaces you were seeing.
        */

        #wall {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(250px, 1fr)
            );

            grid-auto-rows: 8px;
            gap: 14px;

            width: 100%;
            align-items: start;
        }

        /* =========================================================
           MEDIA CARD
        ========================================================= */

        .media-card {
            position: relative;
            width: 100%;
            background: #000;
            border: 2px solid #000;
            overflow: hidden;

            /*
                IMPORTANT:
                No transform.
                No rotation.
                No zoom.
                No animation.
            */

            transition: none;
        }

        .media-card:hover {
            transform: none;
            box-shadow: none;
            border-color: #000;
            filter: none;
        }

        .media-item {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
            cursor: pointer;
        }

        /*
            Prevent accidental image stretching.
        */

        img.media-item {
            object-fit: contain;
        }

        video.media-item {
            object-fit: contain;
        }

        /* =========================================================
           UPLOAD MODAL
        ========================================================= */

        #uploadModal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.88);

            z-index: 5000;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        #uploadModal.show {
            display: flex;
        }

        .upload-box {
            width: min(500px, 100%);
            background: #000;
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            padding: 25px;
        }

        .upload-box h2 {
            margin: 0 0 20px;
            text-align: center;
            color: #ff007f;
            font-size: 1.4rem;
        }

        .upload-box p {
            color: #00ff41;
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: center;
        }

        #fileInput {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px dashed #ff007f;
            background: #050505;
            color: #fff;
            font-family: "Courier New", monospace;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: 2px solid #ff007f;
            background: #ff007f;
            color: #000;
            font-family: "Courier New", monospace;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-buttons button.secondary {
            background: #000;
            color: #ff007f;
        }

        .modal-buttons button:hover {
            opacity: 0.8;
        }

        /* =========================================================
           PROGRESS
        ========================================================= */

        #uploadProgressContainer {
            display: none;
            margin-top: 20px;
        }

        #uploadProgressContainer.show {
            display: block;
        }

        .progress-label {
            color: #00ff41;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #222;
            border: 1px solid #ff007f;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #ff007f;
        }

        /* =========================================================
           LIGHTBOX
        ========================================================= */

        #lightbox {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.95);

            z-index: 6000;

            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        #lightbox.show {
            display: flex;
        }

        #lightboxContent {
            max-width: 95vw;
            max-height: 90vh;
        }

        #lightboxContent img,
        #lightboxContent video {
            display: block;
            max-width: 95vw;
            max-height: 90vh;
            width: auto;
            height: auto;
        }

        #closeLightbox {
            position: fixed;
            top: 15px;
            right: 20px;

            background: none;
            border: none;

            color: #ff007f;
            font-family: "Courier New", monospace;
            font-size: 2rem;

            cursor: pointer;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            header {
                padding: 22px 10px;
            }

            header h1 {
                letter-spacing: 3px;
            }

            #wall {
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(150px, 1fr)
                );

                gap: 8px;
                grid-auto-rows: 6px;
            }

            #wall-container {
                padding: 5px;
            }

            .media-card {
                border-width: 1px;
            }
        }

        @media (max-width: 400px) {

            #wall {
                grid-template-columns: repeat(
                    2,
                    minmax(0, 1fr)
                );
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header>

        <h1>🚨 SYSTEM BREACH 🚨</h1>

        <span>
            DECRYPTING NOWIE VAULT DATA... ACCESS GRANTED
        </span>

    </header>


    <!-- =========================================================
         UPLOAD BUTTON
    ========================================================= -->

    <div class="upload-area">

        <button id="uploadButton">
            ＋ UPLOAD TO VAULT
        </button>

    </div>


    <!-- =========================================================
         STATUS
    ========================================================= -->

    <div id="status">
        CONNECTING TO VAULT...
    </div>


    <!-- =========================================================
         MEDIA WALL
    ========================================================= -->

    <div id="wall-container">

        <div id="wall"></div>

    </div>


    <!-- =========================================================
         UPLOAD MODAL
    ========================================================= -->

    <div id="uploadModal">

        <div class="upload-box">

            <h2>UPLOAD TO VAULT</h2>

            <p>
                ADD YOUR OWN PHOTO OR VIDEO TO THE VAULT.
            </p>

            <p>
                MAXIMUM FILE SIZE: 50 MB
            </p>

            <input
                id="fileInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"
            >

            <div id="uploadProgressContainer">

                <div class="progress-label">
                    UPLOADING...
                </div>

                <div class="progress-bar">
                    <div id="progressBar"></div>
                </div>

            </div>

            <div class="modal-buttons">

                <button id="startUpload">
                    UPLOAD
                </button>

                <button
                    id="cancelUpload"
                    class="secondary"
                >
                    CANCEL
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         LIGHTBOX
    ========================================================= -->

    <div id="lightbox">

        <button id="closeLightbox">
            ×
        </button>

        <div id="lightboxContent"></div>

    </div>


    <script>

        /* =========================================================
           SUPABASE CONFIGURATION
        ========================================================= */

        const SUPABASE_URL =
            "https://wwbbcndlcqxjswxjoxuj.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_sakHwOcB2tV2CqDMrX256Q__taTT9DF";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           GITHUB CONFIGURATION
        ========================================================= */

        const githubUsername = "NewbDev-gif";

        const githubRepo = "troll-wall";

        const githubFolder = "media";


        /* =========================================================
           SUPABASE CONFIGURATION
        ========================================================= */

        const supabaseBucket = "nowie-media";


        /* =========================================================
           SETTINGS
        ========================================================= */

        const MAX_FILE_SIZE =
            50 * 1024 * 1024;

        const allowedExtensions = [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "mp4",
            "webm",
            "mov"
        ];


        /* =========================================================
           DOM
        ========================================================= */

        const wall =
            document.getElementById("wall");

        const status =
            document.getElementById("status");

        const uploadButton =
            document.getElementById("uploadButton");

        const uploadModal =
            document.getElementById("uploadModal");

        const fileInput =
            document.getElementById("fileInput");

        const startUpload =
            document.getElementById("startUpload");

        const cancelUpload =
            document.getElementById("cancelUpload");

        const progressContainer =
            document.getElementById(
                "uploadProgressContainer"
            );

        const progressBar =
            document.getElementById("progressBar");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxContent =
            document.getElementById(
                "lightboxContent"
            );

        const closeLightbox =
            document.getElementById(
                "closeLightbox"
            );


        /* =========================================================
           STATUS FUNCTION
        ========================================================= */

        function setStatus(message, error = false) {

            status.textContent = message;

            status.classList.toggle(
                "error",
                error
            );

        }


        /* =========================================================
           FILE TYPE
        ========================================================= */

        function getExtension(filename) {

            return filename
                .split(".")
                .pop()
                .toLowerCase();

        }


        function isVideo(filename) {

            const ext =
                getExtension(filename);

            return [
                "mp4",
                "webm",
                "mov"
            ].includes(ext);

        }


        /* =========================================================
           MASONRY CALCULATION
        ========================================================= */

        function resizeCard(card) {

            const rowHeight =
                parseFloat(
                    getComputedStyle(wall)
                        .getPropertyValue(
                            "grid-auto-rows"
                        )
                );

            const rowGap =
                parseFloat(
                    getComputedStyle(wall)
                        .getPropertyValue(
                            "gap"
                        )
                );

            const height =
                card.getBoundingClientRect()
                    .height;

            const span =
                Math.ceil(
                    (height + rowGap) /
                    (rowHeight + rowGap)
                );

            card.style.gridRowEnd =
                `span ${span}`;

        }


        function resizeAllCards() {

            const cards =
                document.querySelectorAll(
                    ".media-card"
                );

            cards.forEach(
                resizeCard
            );

        }


        /* =========================================================
           ADD MEDIA TO WALL
        ========================================================= */

        function addMedia(
            url,
            filename,
            source
        ) {

            const card =
                document.createElement("div");

            card.className =
                "media-card";

            card.dataset.source =
                source;


            let media;


            /* =====================================================
               VIDEO
            ===================================================== */

            if (isVideo(filename)) {

                media =
                    document.createElement(
                        "video"
                    );

                media.src = url;

                media.className =
                    "media-item";

                media.muted = true;

                media.loop = true;

                media.playsInline = true;

                media.preload = "metadata";


                /*
                    VIDEO BEHAVIOR

                    Hover = play

                    Mouse leaves = pause + reset
                */

                media.addEventListener(
                    "mouseenter",
                    () => {

                        media.currentTime = 0;

                        media.play()
                            .catch(() => {});

                    }
                );


                media.addEventListener(
                    "mouseleave",
                    () => {

                        media.pause();

                        media.currentTime = 0;

                    }
                );


                /*
                    Recalculate masonry after
                    video metadata is available.
                */

                media.addEventListener(
                    "loadedmetadata",
                    () => {

                        resizeCard(card);

                    }
                );

            }

            /* =====================================================
               IMAGE
            ===================================================== */

            else {

                media =
                    document.createElement(
                        "img"
                    );

                media.src = url;

                media.className =
                    "media-item";

                media.loading =
                    "lazy";

                media.decoding =
                    "async";


                media.addEventListener(
                    "load",
                    () => {

                        resizeCard(card);

                    }
                );

            }


            /* =====================================================
               CLICK = LIGHTBOX
            ===================================================== */

            media.addEventListener(
                "click",
                () => {

                    openLightbox(
                        url,
                        filename
                    );

                }
            );


            card.appendChild(media);

            wall.appendChild(card);


            /*
                Resize once immediately.
            */

            requestAnimationFrame(
                () => resizeCard(card)
            );

        }


        /* =========================================================
           LOAD GITHUB MEDIA
        ========================================================= */

        async function loadGithubMedia() {

            const url =
                `https://api.github.com/repos/` +
                `${githubUsername}/` +
                `${githubRepo}/contents/` +
                `${githubFolder}`;


            try {

                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "GitHub request failed"
                    );

                }


                const files =
                    await response.json();


                if (!Array.isArray(files)) {

                    return;

                }


                files.forEach(file => {

                    if (
                        file.type !==
                        "file"
                    ) {
                        return;
                    }


                    const ext =
                        getExtension(
                            file.name
                        );


                    if (
                        !allowedExtensions
                            .includes(ext)
                    ) {
                        return;
                    }


                    addMedia(
                        file.download_url,
                        file.name,
                        "github"
                    );

                });

            }

            catch (error) {

                console.error(
                    "GitHub media error:",
                    error
                );

            }

        }


        /* =========================================================
           LOAD SUPABASE MEDIA
        ========================================================= */

        async function loadSupabaseMedia() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .storage
                        .from(
                            supabaseBucket
                        )
                        .list(
                            "",
                            {
                                limit: 1000,
                                offset: 0,
                                sortBy: {
                                    column: "created_at",
                                    order: "asc"
                                }
                            }
                        );


                if (error) {

                    throw error;

                }


                if (!data) {

                    return;

                }


                data.forEach(file => {

                    if (!file.name) {
                        return;
                    }


                    const ext =
                        getExtension(
                            file.name
                        );


                    if (
                        !allowedExtensions
                            .includes(ext)
                    ) {
                        return;
                    }


                    const {
                        data: publicData
                    } =
                        supabaseClient
                            .storage
                            .from(
                                supabaseBucket
                            )
                            .getPublicUrl(
                                file.name
                            );


                    if (
                        !publicData ||
                        !publicData.publicUrl
                    ) {
                        return;
                    }


                    addMedia(
                        publicData.publicUrl,
                        file.name,
                        "supabase"
                    );

                });

            }

            catch (error) {

                console.error(
                    "Supabase media error:",
                    error
                );

                setStatus(
                    "SUPABASE CONNECTION ERROR",
                    true
                );

            }

        }


        /* =========================================================
           LOAD EVERYTHING
        ========================================================= */

        async function loadAllMedia() {

            setStatus(
                "CONNECTING TO VAULT..."
            );


            await Promise.all([
                loadGithubMedia(),
                loadSupabaseMedia()
            ]);


            setStatus(
                "VAULT ONLINE — ACCESS GRANTED"
            );


            setTimeout(
                resizeAllCards,
                500
            );

        }


        /* =========================================================
           UPLOAD MODAL
        ========================================================= */

        uploadButton.addEventListener(
            "click",
            () => {

                uploadModal.classList.add(
                    "show"
                );

            }
        );


        cancelUpload.addEventListener(
            "click",
            closeUploadModal
        );


        function closeUploadModal() {

            uploadModal.classList.remove(
                "show"
            );

            fileInput.value = "";

            progressContainer.classList.remove(
                "show"
            );

            progressBar.style.width =
                "0%";

        }


        /* =========================================================
           UPLOAD FILE
        ========================================================= */

        startUpload.addEventListener(
            "click",
            uploadFile
        );


        async function uploadFile() {

            const file =
                fileInput.files[0];


            if (!file) {

                alert(
                    "Please choose a photo or video."
                );

                return;

            }


            /* =====================================================
               SIZE CHECK
            ===================================================== */

            if (
                file.size >
                MAX_FILE_SIZE
            ) {

                alert(
                    "File is too large.\n\n" +
                    "Maximum size: 50 MB"
                );

                return;

            }


            /* =====================================================
               EXTENSION CHECK
            ===================================================== */

            const ext =
                getExtension(
                    file.name
                );


            if (
                !allowedExtensions
                    .includes(ext)
            ) {

                alert(
                    "This file type is not allowed."
                );

                return;

            }


            /* =====================================================
               UNIQUE FILE NAME
            ===================================================== */

            const timestamp =
                Date.now();

            const random =
                Math.random()
                    .toString(36)
                    .substring(
                        2,
                        10
                    );


            const safeName =
                file.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


            const finalName =
                `${timestamp}_${random}_${safeName}`;


            /* =====================================================
               UI
            ===================================================== */

            startUpload.disabled =
                true;

            cancelUpload.disabled =
                true;

            uploadButton.disabled =
                true;

            progressContainer.classList.add(
                "show"
            );

            progressBar.style.width =
                "10%";


            setStatus(
                "UPLOADING MEDIA..."
            );


            try {

                /*
                    Upload to Supabase
                */

                const {
                    error
                } =
                    await supabaseClient
                        .storage
                        .from(
                            supabaseBucket
                        )
                        .upload(
                            finalName,
                            file,
                            {
                                cacheControl:
                                    "3600",

                                contentType:
                                    file.type,

                                upsert:
                                    false
                            }
                        );


                if (error) {

                    throw error;

                }


                progressBar.style.width =
                    "100%";


                /*
                    Get public URL
                */

                const {
                    data: publicData
                } =
                    supabaseClient
                        .storage
                        .from(
                            supabaseBucket
                        )
                        .getPublicUrl(
                            finalName
                        );


                /*
                    Immediately add the
                    uploaded media to the wall.
                */

                addMedia(
                    publicData.publicUrl,
                    finalName,
                    "supabase"
                );


                setStatus(
                    "✓ UPLOAD COMPLETE — MEDIA ADDED TO VAULT"
                );


                setTimeout(
                    closeUploadModal,
                    1000
                );

            }

            catch (error) {

                console.error(
                    "Upload failed:",
                    error
                );


                setStatus(
                    "UPLOAD FAILED: " +
                    error.message,
                    true
                );


                alert(
                    "UPLOAD FAILED\n\n" +
                    error.message
                );

            }


            finally {

                startUpload.disabled =
                    false;

                cancelUpload.disabled =
                    false;

                uploadButton.disabled =
                    false;

            }

        }


        /* =========================================================
           LIGHTBOX
        ========================================================= */

        function openLightbox(
            url,
            filename
        ) {

            lightboxContent.innerHTML =
                "";


            let element;


            if (isVideo(filename)) {

                element =
                    document.createElement(
                        "video"
                    );

                element.src = url;

                element.controls =
                    true;

                element.autoplay =
                    true;

                element.loop =
                    true;

                element.playsInline =
                    true;

            }

            else {

                element =
                    document.createElement(
                        "img"
                    );

                element.src = url;

                element.alt =
                    filename;

            }


            lightboxContent.appendChild(
                element
            );


            lightbox.classList.add(
                "show"
            );

        }


        function closeLightboxWindow() {

            lightbox.classList.remove(
                "show"
            );

            lightboxContent.innerHTML =
                "";

        }


        closeLightbox.addEventListener(
            "click",
            closeLightboxWindow
        );


        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    lightbox
                ) {

                    closeLightboxWindow();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeLightboxWindow();

                }

            }
        );


        /* =========================================================
           WINDOW RESIZE
        ========================================================= */

        let resizeTimer;


        window.addEventListener(
            "resize",
            () => {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        resizeAllCards,
                        150
                    );

            }
        );


        /* =========================================================
           START
        ========================================================= */

        loadAllMedia();

    </script>

</body>
</html>
