<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>SYSTEM BREACH: NOWIE VAULT</title>


    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html {
            background: #000;
        }


        body {

            margin: 0;
            padding: 0;

            min-height: 100vh;

            width: 100%;

            background: #000;

            color: #ff007f;

            font-family:
                "Courier New",
                Courier,
                monospace;

            overflow-x: hidden;
        }


        /* =========================================================
           SCROLLBAR
        ========================================================= */

        ::-webkit-scrollbar {
            width: 8px;
        }


        ::-webkit-scrollbar-track {
            background: #000;
        }


        ::-webkit-scrollbar-thumb {

            background: #ff007f;

            border-radius: 10px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            padding: 25px 15px;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.96);

            border-bottom:
                3px solid #ff007f;

            box-shadow:
                0 0 20px
                rgba(255, 0, 127, 0.5);
        }


        header h1 {

            margin: 0;

            color: #ff007f;

            font-size:
                clamp(
                    1.4rem,
                    4vw,
                    2.2rem
                );

            letter-spacing: 5px;

            text-transform: uppercase;

            text-shadow:
                2px 2px 0 #fff;
        }


        header span {

            display: block;

            margin-top: 10px;

            color: #00ff41;

            font-size: 0.9rem;

            font-weight: bold;

            letter-spacing: 1px;
        }


        /* =========================================================
           FILTER BAR
        ========================================================= */

        #filter-bar {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;

            padding: 10px 15px;

            background: #050505;

            border-bottom: 1px solid #222;

            position: sticky;

            top: 101px;

            z-index: 900;
        }


        .filter-button {

            padding: 7px 14px;

            background: #000;

            color: #ff007f;

            border:
                1px solid #ff007f;

            font-family:
                "Courier New",
                Courier,
                monospace;

            font-size: 0.75rem;

            font-weight: bold;

            cursor: pointer;
        }


        .filter-button:hover,
        .filter-button.active {

            background: #ff007f;

            color: #000;
        }


        /* =========================================================
           STATUS
        ========================================================= */

        #status-bar {

            display: flex;

            justify-content: center;

            gap: 20px;

            padding: 9px 15px;

            background: #050505;

            border-bottom: 1px solid #222;

            font-size: 0.75rem;

            text-align: center;
        }


        #status {
            color: #00ff41;
        }


        #counter {
            color: #ff007f;
        }


        /* =========================================================
           WALL CONTAINER
        ========================================================= */

        #wall-container {

            width: 100%;

            padding: 20px;

            background: #ff007f;
        }


        /* =========================================================
           TRUE MASONRY
        ========================================================= */

        #wall {

            display: grid;

            grid-template-columns:
                repeat(
                    var(--columns, 1),
                    minmax(0, 1fr)
                );

            gap: 15px;

            width: 100%;

            align-items: start;
        }


        .masonry-column {

            display: flex;

            flex-direction: column;

            gap: 15px;

            min-width: 0;
        }


        /* =========================================================
           MEDIA
        ========================================================= */

        .media-link {

            display: block;

            width: 100%;

            background: #000;

            border:
                2px solid #000;

            line-height: 0;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease,
                filter 0.3s ease;
        }


        .media-link:hover {

            transform:
                scale(1.03)
                rotate(0.5deg);

            border-color: #fff;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.6);

            filter:
                brightness(1.15);
        }


        .media-item {

            display: block;

            width: 100%;

            height: auto;

            background: #000;

            object-fit: contain;
        }


        /* =========================================================
           LOADING / ERROR
        ========================================================= */

        .loading,
        .error {

            grid-column: 1 / -1;

            width: 100%;

            padding: 60px 20px;

            background: #000;

            color: #fff;

            border: 2px solid #fff;

            text-align: center;

            line-height: 1.8;
        }


        /* =========================================================
           LIGHTBOX
        ========================================================= */

        #lightbox {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 60px 20px 40px;

            background:
                rgba(0, 0, 0, 0.96);
        }


        #lightbox.active {
            display: flex;
        }


        #lightbox-content {

            display: flex;

            align-items: center;

            justify-content: center;

            max-width: 95vw;

            max-height: 85vh;
        }


        #lightbox-content img,
        #lightbox-content video {

            display: block;

            max-width: 90vw;

            max-height: 82vh;

            width: auto;

            height: auto;

            object-fit: contain;

            background: #000;

            box-shadow:
                0 0 30px
                rgba(255, 0, 127, 0.4);
        }


        /* =========================================================
           LIGHTBOX BUTTONS
        ========================================================= */

        .lightbox-button {

            position: absolute;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 50px;

            height: 50px;

            background: #000;

            color: #ff007f;

            border:
                2px solid #ff007f;

            font-family:
                "Courier New",
                Courier,
                monospace;

            font-size: 1.5rem;

            cursor: pointer;
        }


        .lightbox-button:hover {

            background: #ff007f;

            color: #000;
        }


        #close-lightbox {

            top: 15px;

            right: 15px;
        }


        #previous {

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);
        }


        #next {

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);
        }


        #lightbox-info {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 10px;

            color: #00ff41;

            text-align: center;

            font-size: 0.75rem;

            padding: 5px 60px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            header {

                padding: 18px 10px;
            }


            header h1 {

                letter-spacing: 2px;

                font-size: 1.4rem;
            }


            header span {

                font-size: 0.7rem;
            }


            #filter-bar {

                top: 86px;

                gap: 5px;

                padding: 7px 5px;
            }


            .filter-button {

                padding:
                    6px 9px;

                font-size:
                    0.65rem;
            }


            #wall-container {

                padding: 10px;
            }


            #wall {

                gap: 10px;
            }


            .masonry-column {

                gap: 10px;
            }


            #previous,
            #next {

                width: 40px;

                height: 40px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header>

        <h1>
            🚨 SYSTEM BREACH 🚨
        </h1>

        <span>
            DECRYPTING NOWIE VAULT DATA...
            ACCESS GRANTED
        </span>

    </header>


    <!-- =========================================================
         FILTERS
    ========================================================= -->

    <nav id="filter-bar">

        <button
            class="filter-button active"
            data-filter="all"
            type="button"
        >
            ALL
        </button>


        <button
            class="filter-button"
            data-filter="image"
            type="button"
        >
            IMAGES
        </button>


        <button
            class="filter-button"
            data-filter="gif"
            type="button"
        >
            GIFS
        </button>


        <button
            class="filter-button"
            data-filter="video"
            type="button"
        >
            VIDEOS
        </button>

    </nav>


    <!-- =========================================================
         STATUS
    ========================================================= -->

    <div id="status-bar">

        <div id="status">
            CONNECTING TO VAULT...
        </div>

        <div id="counter">
            0 FILES
        </div>

    </div>


    <!-- =========================================================
         WALL
    ========================================================= -->

    <main id="wall-container">

        <div id="wall">

            <div class="loading">

                ACCESSING VAULT...

            </div>

        </div>

    </main>


    <!-- =========================================================
         LIGHTBOX
    ========================================================= -->

    <div
        id="lightbox"
        aria-hidden="true"
    >

        <button
            id="close-lightbox"
            class="lightbox-button"
            type="button"
        >
            ×
        </button>


        <button
            id="previous"
            class="lightbox-button"
            type="button"
        >
            ‹
        </button>


        <div id="lightbox-content"></div>


        <button
            id="next"
            class="lightbox-button"
            type="button"
        >
            ›
        </button>


        <div id="lightbox-info"></div>

    </div>


    <script>

        /* =========================================================
           GITHUB CONFIGURATION
        ========================================================= */

        const username =
            "NewbDev-gif";


        const repo =
            "troll-wall";


        const folder =
            "media";


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const wall =
            document.getElementById(
                "wall"
            );


        const status =
            document.getElementById(
                "status"
            );


        const counter =
            document.getElementById(
                "counter"
            );


        const lightbox =
            document.getElementById(
                "lightbox"
            );


        const lightboxContent =
            document.getElementById(
                "lightbox-content"
            );


        const lightboxInfo =
            document.getElementById(
                "lightbox-info"
            );


        const closeButton =
            document.getElementById(
                "close-lightbox"
            );


        const previousButton =
            document.getElementById(
                "previous"
            );


        const nextButton =
            document.getElementById(
                "next"
            );


        const filterButtons =
            document.querySelectorAll(
                ".filter-button"
            );


        /* =========================================================
           DATA
        ========================================================= */

        let allMedia = [];

        let filteredMedia = [];

        let currentIndex = 0;

        let currentFilter = "all";


        /* =========================================================
           GITHUB API
        ========================================================= */

        async function loadMedia() {

            status.textContent =
                "CONNECTING TO VAULT...";


            const apiURL =
                `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;


            try {

                const response =
                    await fetch(
                        apiURL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `GitHub API returned ${response.status}`
                    );

                }


                const files =
                    await response.json();


                if (
                    !Array.isArray(files)
                ) {

                    throw new Error(
                        "GitHub did not return a folder."
                    );

                }


                /* =================================================
                   SUPPORTED FILES
                ================================================= */

                const validExtensions = [

                    "jpg",
                    "jpeg",
                    "png",
                    "gif",
                    "webp",
                    "mp4",
                    "mov",
                    "webm"

                ];


                allMedia =
                    files

                        .filter(
                            file =>
                                file.type ===
                                "file"
                        )

                        .filter(
                            file => {

                                const extension =
                                    file.name
                                        .split(".")
                                        .pop()
                                        .toLowerCase();


                                return validExtensions
                                    .includes(
                                        extension
                                    );

                            }
                        )

                        .sort(
                            (a, b) =>
                                a.name.localeCompare(
                                    b.name,
                                    undefined,
                                    {
                                        numeric: true
                                    }
                                )
                        );


                counter.textContent =
                    `${allMedia.length} FILES`;


                status.textContent =
                    "DATABASE ONLINE";


                applyFilter(
                    "all"
                );

            }


            catch (error) {

                console.error(
                    "Vault connection error:",
                    error
                );


                status.textContent =
                    "DATABASE ERROR";


                counter.textContent =
                    "ERROR";


                wall.innerHTML = `

                    <div class="error">

                        ⚠ DATABASE ERROR

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                        <br><br>

                        Make sure the
                        <strong>
                            media
                        </strong>
                        folder exists in:

                        <br><br>

                        ${username}/${repo}

                    </div>

                `;

            }

        }


        /* =========================================================
           FILE TYPE
        ========================================================= */

        function getFileType(
            file
        ) {

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            if (
                extension === "mp4" ||
                extension === "mov" ||
                extension === "webm"
            ) {

                return "video";

            }


            if (
                extension === "gif"
            ) {

                return "gif";

            }


            return "image";

        }


        /* =========================================================
           FILTER
        ========================================================= */

        function applyFilter(
            filter
        ) {

            currentFilter =
                filter;


            if (
                filter === "all"
            ) {

                filteredMedia =
                    [...allMedia];

            }

            else {

                filteredMedia =
                    allMedia.filter(
                        file =>
                            getFileType(
                                file
                            ) === filter
                    );

            }


            counter.textContent =
                `${filteredMedia.length} FILES`;


            renderWall();

        }


        /* =========================================================
           COLUMN COUNT
        ========================================================= */

        function getColumnCount() {

            const width =
                window.innerWidth;


            if (
                width <= 500
            ) {

                return 2;

            }


            if (
                width <= 800
            ) {

                return 3;

            }


            if (
                width <= 1100
            ) {

                return 4;

            }


            if (
                width <= 1400
            ) {

                return 5;

            }


            return 6;

        }


        /* =========================================================
           RENDER WALL
        ========================================================= */

        function renderWall() {

            wall.innerHTML = "";


            if (
                filteredMedia.length === 0
            ) {

                wall.style.setProperty(
                    "--columns",
                    1
                );


                wall.innerHTML = `

                    <div class="error">

                        NO MEDIA FOUND

                    </div>

                `;

                return;

            }


            let columnCount =
                getColumnCount();


            columnCount =
                Math.min(
                    columnCount,
                    filteredMedia.length
                );


            wall.style.setProperty(
                "--columns",
                columnCount
            );


            /* =====================================================
               CREATE COLUMNS
            ===================================================== */

            const columns = [];


            const heights = [];


            for (
                let i = 0;
                i < columnCount;
                i++
            ) {

                const column =
                    document.createElement(
                        "div"
                    );


                column.className =
                    "masonry-column";


                wall.appendChild(
                    column
                );


                columns.push(
                    column
                );


                heights.push(
                    0
                );

            }


            /* =====================================================
               ADD MEDIA
            ===================================================== */

            filteredMedia.forEach(
                (
                    file,
                    index
                ) => {


                    const card =
                        createMediaCard(
                            file,
                            index
                        );


                    /*
                        Find the shortest
                        column.
                    */

                    let shortest =
                        0;


                    for (
                        let i = 1;
                        i < heights.length;
                        i++
                    ) {

                        if (
                            heights[i] <
                            heights[shortest]
                        ) {

                            shortest =
                                i;

                        }

                    }


                    columns[
                        shortest
                    ].appendChild(
                        card
                    );


                    /*
                        Temporary height.
                        It will be corrected
                        after images load.
                    */

                    heights[
                        shortest
                    ] += 1;

                }
            );


            /*
                Wait for browser to
                render media, then
                properly balance columns.
            */

            waitForImages();

        }


        /* =========================================================
           CREATE CARD
        ========================================================= */

        function createMediaCard(
            file,
            index
        ) {

            const link =
                document.createElement(
                    "a"
                );


            link.href = "#";


            link.className =
                "media-link";


            link.dataset.index =
                index;


            link.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    openLightbox(
                        index
                    );

                }
            );


            const type =
                getFileType(
                    file
                );


            let element;


            /* =====================================================
               VIDEO
            ===================================================== */

            if (
                type === "video"
            ) {

                element =
                    document.createElement(
                        "video"
                    );


                element.src =
                    file.download_url;


                element.autoplay =
                    true;


                element.loop =
                    true;


                element.muted =
                    true;


                element.playsInline =
                    true;


                element.preload =
                    "metadata";

            }


            /* =====================================================
               IMAGE
            ===================================================== */

            else {

                element =
                    document.createElement(
                        "img"
                    );


                element.src =
                    file.download_url;


                element.loading =
                    "lazy";


                element.decoding =
                    "async";


                element.alt =
                    file.name;

            }


            element.className =
                "media-item";


            link.appendChild(
                element
            );


            return link;

        }


        /* =========================================================
           BALANCE MASONRY
        ========================================================= */

        function waitForImages() {

            const media =
                document.querySelectorAll(
                    ".media-item"
                );


            if (
                media.length === 0
            ) {

                return;

            }


            let remaining =
                media.length;


            const finished =
                () => {

                    remaining--;


                    if (
                        remaining <= 0
                    ) {

                        rebalance();

                    }

                };


            media.forEach(
                element => {

                    if (
                        element.tagName ===
                        "VIDEO"
                    ) {

                        if (
                            element.readyState >=
                            1
                        ) {

                            finished();

                        }

                        else {

                            element.addEventListener(
                                "loadedmetadata",
                                finished,
                                {
                                    once: true
                                }
                            );

                            element.addEventListener(
                                "error",
                                finished,
                                {
                                    once: true
                                }
                            );

                        }

                    }

                    else {

                        if (
                            element.complete
                        ) {

                            finished();

                        }

                        else {

                            element.addEventListener(
                                "load",
                                finished,
                                {
                                    once: true
                                }
                            );

                            element.addEventListener(
                                "error",
                                finished,
                                {
                                    once: true
                                }
                            );

                        }

                    }

                }
            );


            /*
                Safety fallback.

                Prevents one broken image
                from stopping masonry.
            */

            setTimeout(
                () => {

                    rebalance();

                },
                2000
            );

        }


        /* =========================================================
           REBALANCE
        ========================================================= */

        function rebalance() {

            const cards =
                Array.from(
                    document.querySelectorAll(
                        ".media-link"
                    )
                );


            const columns =
                Array.from(
                    document.querySelectorAll(
                        ".masonry-column"
                    )
                );


            if (
                columns.length === 0
            ) {

                return;

            }


            /*
                Remove cards first.
            */

            columns.forEach(
                column => {

                    column.innerHTML =
                        "";

                }
            );


            const heights =
                columns.map(
                    () => 0
                );


            /*
                Place cards into
                shortest column.
            */

            cards.forEach(
                card => {

                    let shortest =
                        0;


                    for (
                        let i = 1;
                        i < heights.length;
                        i++
                    ) {

                        if (
                            heights[i] <
                            heights[shortest]
                        ) {

                            shortest =
                                i;

                        }

                    }


                    columns[
                        shortest
                    ].appendChild(
                        card
                    );


                    heights[
                        shortest
                    ] =
                        columns[
                            shortest
                        ].getBoundingClientRect()
                            .height;

                }
            );

        }


        /* =========================================================
           LIGHTBOX
        ========================================================= */

        function openLightbox(
            index
        ) {

            currentIndex =
                index;


            renderLightbox();


            lightbox.classList.add(
                "active"
            );


            lightbox.setAttribute(
                "aria-hidden",
                "false"
            );


            document.body.style.overflow =
                "hidden";

        }


        /* =========================================================
           RENDER LIGHTBOX
        ========================================================= */

        function renderLightbox() {

            const file =
                filteredMedia[
                    currentIndex
                ];


            if (!file) {
                return;
            }


            const type =
                getFileType(
                    file
                );


            lightboxContent.innerHTML =
                "";


            let element;


            if (
                type === "video"
            ) {

                element =
                    document.createElement(
                        "video"
                    );


                element.src =
                    file.download_url;


                element.controls =
                    true;


                element.autoplay =
                    true;


                element.loop =
                    true;


                element.muted =
                    true;


                element.playsInline =
                    true;

            }

            else {

                element =
                    document.createElement(
                        "img"
                    );


                element.src =
                    file.download_url;


                element.alt =
                    file.name;

            }


            lightboxContent.appendChild(
                element
            );


            lightboxInfo.textContent =
                `${currentIndex + 1} / ${
                    filteredMedia.length
                } — ${
                    file.name
                }`;

        }


        /* =========================================================
           CLOSE
        ========================================================= */

        function closeLightbox() {

            lightbox.classList.remove(
                "active"
            );


            lightbox.setAttribute(
                "aria-hidden",
                "true"
            );


            lightboxContent.innerHTML =
                "";


            document.body.style.overflow =
                "";

        }


        /* =========================================================
           PREVIOUS
        ========================================================= */

        function previousMedia() {

            if (
                filteredMedia.length === 0
            ) {

                return;

            }


            currentIndex--;


            if (
                currentIndex < 0
            ) {

                currentIndex =
                    filteredMedia.length - 1;

            }


            renderLightbox();

        }


        /* =========================================================
           NEXT
        ========================================================= */

        function nextMedia() {

            if (
                filteredMedia.length === 0
            ) {

                return;

            }


            currentIndex++;


            if (
                currentIndex >=
                filteredMedia.length
            ) {

                currentIndex = 0;

            }


            renderLightbox();

        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        filterButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        filterButtons.forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        button.classList.add(
                            "active"
                        );


                        applyFilter(
                            button.dataset.filter
                        );

                    }
                );

            }
        );


        closeButton.addEventListener(
            "click",
            closeLightbox
        );


        previousButton.addEventListener(
            "click",
            previousMedia
        );


        nextButton.addEventListener(
            "click",
            nextMedia
        );


        /* =========================================================
           CLICK OUTSIDE
        ========================================================= */

        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    return;

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeLightbox();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousMedia();

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextMedia();

                }

            }
        );


        /* =========================================================
           RESIZE
        ========================================================= */

        let resizeTimer;


        window.addEventListener(
            "resize",
            () => {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        () => {

                            renderWall();

                        },
                        300
                    );

            }
        );


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHTML(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =========================================================
           START
        ========================================================= */

        loadMedia();

    </script>

</body>

</html>
