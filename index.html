/* =========================================================
   LOAD GITHUB MEDIA
========================================================= */

async function loadGithubMedia() {

    try {

        const response =
            await fetch(
                GITHUB_API_URL
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "GitHub API request failed"
            );
        }


        const files =
            await response.json();


        if (
            !Array.isArray(files)
        ) {

            return [];
        }


        const validExtensions = [

            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "mp4",
            "mov",
            "webm"

        ];


        return files

            .filter(file => {

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                return validExtensions
                    .includes(
                        extension
                    );
            })

            .map(file => {

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const isVideo =
                    [
                        "mp4",
                        "mov",
                        "webm"
                    ].includes(
                        extension
                    );


                return {

                    id:
                        "github-" +
                        file.name,

                    filename:
                        file.name,

                    storage_path:
                        "github/media/" +
                        file.name,

                    public_url:
                        file.download_url,

                    media_type:
                        isVideo
                            ? "video/" +
                              extension
                            : "image/" +
                              extension,

                    caption:
                        null,

                    uploaded_by:
                        null,

                    created_at:
                        null,

                    isGithub:
                        true
                };
            });


    } catch (error) {

        console.error(
            "GitHub media error:",
            error
        );

        return [];
    }
}


/* =========================================================
   MERGE MEDIA
========================================================= */

function mergeMedia(
    supabaseMedia,
    githubMedia
) {

    const result = [];


    for (
        const item of supabaseMedia
    ) {

        result.push({

            ...item,

            isGithub: false

        });
    }


    for (
        const githubItem of githubMedia
    ) {

        const exists =
            result.some(
                item =>
                    item.filename ===
                    githubItem.filename
            );


        if (!exists) {

            result.push(
                githubItem
            );
        }
    }


    return result;
}

                "user_id,vote"
            )
            .eq(
                "media_id",
                mediaId
            );


    if (error) {

        console.error(
            "Vote loading error:",
            error
        );

        return {

            likes: 0,

            dislikes: 0,

            userVote: 0
        };
    }


    let likes = 0;

    let dislikes = 0;

    let userVote = 0;


    for (
        const row of data || []
    ) {

        if (
            row.vote === 1
        ) {

            likes++;
        }


        if (
            row.vote === -1
        ) {

            dislikes++;
        }


        if (
            currentUser &&
            row.user_id ===
            currentUser.id
        ) {

            userVote =
                row.vote;
        }
    }


    return {

        likes,

        dislikes,

        userVote
    };
}


/* =========================================================
   COMMENT DATA
========================================================= */

async function getCommentData(
    mediaId
) {

    if (
        !mediaId ||
        String(mediaId)
            .startsWith("github-")
    ) {

        return [];
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("media_comments")
            .select(
                "id,user_id,comment,created_at"
            )
            .eq(
                "media_id",
                mediaId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Comment loading error:",
            error
        );

        return [];
    }


    return data || [];
}


/* =========================================================
   ALL LIKE COUNTS
========================================================= */

async function getAllLikeCounts(
    mediaItems
) {

    const likeCounts = {};


    const mediaIds =
        mediaItems

            .filter(item =>
                !item.isGithub
            )

            .map(item =>
                item.id
            );


    if (
        mediaIds.length === 0
    ) {

        return likeCounts;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("media_votes")
            .select(
                "media_id,vote"
            )
            .in(
                "media_id",
                mediaIds
            );


    if (error) {

        console.error(
            "Like count loading error:",
            error
        );

        return likeCounts;
    }


    for (
        const row of data || []
    ) {

        if (
            !likeCounts[row.media_id]
        ) {

            likeCounts[row.media_id] =
                0;
        }


        if (
            row.vote === 1
        ) {

            likeCounts[row.media_id]++;
        }
    }


    return likeCounts;
}


/* =========================================================
   FORMAT COMMENT DATE
========================================================= */

function formatCommentDate(
    date
) {

    if (!date) {

        return "";
    }


    try {

        return new Date(date)
            .toLocaleString();

    } catch {

        return "";
    }
}

/* =========================================================
   RENDER COMMENTS
========================================================= */

async function renderComments(
    item,
    commentList,
    commentCount
) {

    if (
        item.isGithub
    ) {

        commentList.innerHTML = "";

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "comment-empty";

        empty.textContent =
            "COMMENTS ARE ONLY AVAILABLE FOR VAULT MEDIA.";

        commentList.appendChild(
            empty
        );

        commentCount.textContent =
            "0";

        return;
    }


    const comments =
        await getCommentData(
            item.id
        );


    commentList.innerHTML = "";


    commentCount.textContent =
        comments.length;


    if (
        comments.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "comment-empty";

        empty.textContent =
            "NO COMMENTS YET.";

        commentList.appendChild(
            empty
        );

        return;
    }


    for (
        const comment of comments
    ) {

        commentList.appendChild(
            createCommentElement(
                comment
            )
        );
    }
}

/* =========================================================
   ADD COMMENT
========================================================= */

async function addComment(
    item,
    input,
    submitButton,
    commentList,
    commentCount
) {

    if (
        item.isGithub
    ) {

        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    if (!currentUser) {

        await ensureUser();
    }


    if (!currentUser) {

        showNotification(
            "COMMENT ERROR",
            "Unable to create visitor identity.",
            "⚠️"
        );

        return;
    }


    submitButton.disabled =
        true;


    submitButton.textContent =
        "...";


    try {

        const {
            error
        } =
            await supabaseClient
                .from("media_comments")
                .insert({

                    media_id:
                        item.id,

                    user_id:
                        currentUser.id,

                    comment:
                        text

                });


        if (error) {

            throw error;
        }


        input.value =
            "";


        await renderComments(
            item,
            commentList,
            commentCount
        );


    } catch (error) {

        console.error(
            "Comment failed:",
            error
        );


        showNotification(
            "COMMENT FAILED",
            error.message ||
            "Unable to post comment.",
            "❌"
        );

    } finally {

        submitButton.disabled =
            false;

        submitButton.textContent =
            "POST";
    }
}

        );

    ===================================================== */

        isAdmin &&

                "button"
            );

            "delete-button";

            "DELETE";


        deleteButton.onclick =
            async function(event) {

                event.stopPropagation();

                await deleteMedia(
                    item,

            };

            deleteButton
        );


        card.appendChild(

        );

        mediaElement.muted =
            true;


        mediaElement.loop =

        mediaElement.playsInline =
            true;

            "mouseenter",
            () => {

                mediaElement
                    .play()
                    .catch(
                        () => {}

        );

        );

    );

    );

        );

        );

            "button"

    commentInputRow.appendChild(

    );

    );

        );

        dislikeButton,

            item.id

    ===================================================== */

            if (
                commentsSection.classList.contains(

            ) {

                await renderComments(
                    item,

                    commentSubmit,

       LIKE

                dislikeButton
            );

                currentViewerItem &&
                currentViewerItem.id ===
                item.id
            ) {

                await refreshViewerVotes();
            }
        };


    return card;

/* =========================================================
   UPDATE VOTES
========================================================= */

function updateVoteButtons(
    likeButton,
    dislikeButton,
    voteData
) {

    const likeCount =
        likeButton.querySelector(
            ".vote-count"
        );


    const dislikeCount =
        dislikeButton.querySelector(
            ".vote-count"
        );


    likeCount.textContent =
        voteData.likes;


    dislikeCount.textContent =
        voteData.dislikes;


    likeButton.classList.toggle(
        "active-like",
        voteData.userVote === 1
    );


    dislikeButton.classList.toggle(
        "active-dislike",
        voteData.userVote === -1
    );
}


/* =========================================================
   VOTE
========================================================= */

async function voteForMedia(
    item,
    newVote,
    likeButton,
    dislikeButton
) {

    if (
        item.isGithub
    ) {

        return;
    }


    if (!currentUser) {

        await ensureUser();
    }


    if (!currentUser) {

        showNotification(
            "VOTE ERROR",
            "Unable to create visitor identity.",
            "⚠️"
        );

        return;
    }


    const {
        data: existingVote,
        error: findError
    } =
        await supabaseClient
            .from("media_votes")
            .select(
                "id,vote"
            )
            .eq(
                "media_id",
                item.id
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (findError) {

        console.error(
            "Finding vote failed:",
            findError
        );

        showNotification(
            "VOTE ERROR",
            "Unable to check your existing vote.",
            "⚠️"
        );

        return;
    }


    if (
        existingVote &&
        existingVote.vote === newVote
    ) {

        const {
            error
        } =
            await supabaseClient
                .from("media_votes")
                .delete()
                .eq(
                    "id",
                    existingVote.id
                );


        if (error) {

            console.error(
                "Removing vote failed:",
                error
            );

            showNotification(
                "VOTE ERROR",
                "Unable to remove vote.",
                "⚠️"
            );

            return;
        }


    } else if (existingVote) {

        const {
            error
        } =
            await supabaseClient
                .from("media_votes")
                .update({
                    vote: newVote
                })
                .eq(
                    "id",
                    existingVote.id
                );


        if (error) {

            console.error(
                "Changing vote failed:",
                error
            );

            showNotification(
                "VOTE ERROR",
                "Unable to change vote.",
                "⚠️"
            );

            return;
        }


    } else {

        const {
            error
        } =
            await supabaseClient
                .from("media_votes")
                .insert({

                    media_id:
                        item.id,

                    user_id:
                        currentUser.id,

                    vote:
                        newVote

                });


        if (error) {

            console.error(
                "Creating vote failed:",
                error
            );

            showNotification(
                "VOTE ERROR",
                "Unable to vote.",
                "⚠️"
            );

            return;
        }
    }


    const voteData =
        await getVoteData(
            item.id
        );


    updateVoteButtons(
        likeButton,
        dislikeButton,
        voteData
    );
}


/* =========================================================
   REFRESH VIEWER VOTES
========================================================= */

async function refreshViewerVotes() {

    if (
        !currentViewerItem
    ) {

        return;
    }


    const voteData =
        await getVoteData(
            currentViewerItem.id
        );


    viewerLikeCount.textContent =
        voteData.likes;


    viewerDislikeCount.textContent =
        voteData.dislikes;


    viewerLike.classList.toggle(
        "active-like",
        voteData.userVote === 1
    );


    viewerDislike.classList.toggle(
        "active-dislike",
        voteData.userVote === -1
    );
}


/* =========================================================
   OPEN MEDIA VIEWER
========================================================= */

async function openMediaViewer(
    item
) {

    currentViewerItem =
        item;


    document.body.classList.add(
        "modal-open"
    );


    viewerImage.style.display =
        "none";

    viewerVideo.style.display =
        "none";


    viewerImage.src =
        "";

    viewerVideo.src =
        "";


    /* CAPTION */

    if (
        item.caption &&
        item.caption.trim()
    ) {

        viewerCaption.textContent =
            item.caption;

        viewerCaption.classList.remove(
            "empty"
        );

    } else {

        viewerCaption.textContent =
            "NO CAPTION";

        viewerCaption.classList.add(
            "empty"
        );
    }


    /* MEDIA TYPE */

    const isVideo =
        String(
            item.media_type || ""
        ).startsWith(
            "video/"
        );


    if (isVideo) {

        viewerVideo.src =
            item.public_url;

        viewerVideo.style.display =
            "block";

        viewerVideo.load();

    } else {

        viewerImage.src =
            item.public_url;

        viewerImage.style.display =
            "block";
    }


    /* SHOW */

    mediaViewer.classList.add(
        "show"
    );


    /* LOAD VOTES */

    if (
        item.isGithub
    ) {

        viewerLikeCount.textContent =
            "0";

        viewerDislikeCount.textContent =
            "0";

        viewerLike.classList.remove(
            "active-like"
        );

        viewerDislike.classList.remove(
            "active-dislike"
        );

    } else {

        await refreshViewerVotes();
    }


    /* COMMENTS */

    await renderViewerComments(
        item
    );


    /*
     * Automatically scroll comments
     * to the newest comment.
     */

    viewerCommentList.scrollTop =
        viewerCommentList.scrollHeight;
}


/* =========================================================
   CLOSE MEDIA VIEWER
========================================================= */

function closeMediaViewer() {

    mediaViewer.classList.remove(
        "show"
    );


    document.body.classList.remove(
        "modal-open"
    );


    viewerVideo.pause();

    viewerVideo.removeAttribute(
        "src"
    );

    viewerVideo.load();


    viewerImage.removeAttribute(
        "src"
    );


    currentViewerItem =
        null;


    viewerCommentInput.value =
        "";
}

/* =========================================================
   VIEWER VOTE
========================================================= */

async function voteForViewer(
    newVote
) {

    if (
        !currentViewerItem ||
        currentViewerItem.isGithub
    ) {

        return;
    }


    if (!currentUser) {

        await ensureUser();
    }


    if (!currentUser) {

        showNotification(
            "VOTE ERROR",
            "Unable to create visitor identity.",
            "⚠️"
        );

        return;
    }


    const {
        data: existingVote,
        error: findError
    } =
        await supabaseClient
            .from("media_votes")
            .select(
                "id,vote"
            )
            .eq(
                "media_id",
                currentViewerItem.id
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();


    if (findError) {

        console.error(
            "Viewer vote lookup failed:",
            findError
        );

        return;
    }


    if (
        existingVote &&
        existingVote.vote === newVote
    ) {

        const {
            error
        } =
            await supabaseClient
                .from("media_votes")
                .delete()
                .eq(
                    "id",
                    existingVote.id
                );


        if (error) {

            showNotification(
                "VOTE ERROR",
                "Unable to remove vote.",
                "⚠️"
            );

            return;
        }


    } else if (existingVote) {

        const {
            error
        } =
            await supabaseClient
                .from("media_votes")
                .update({
                    vote: newVote
                })
                .eq(
                    "id",
                    existingVote.id
                );


        if (error) {

            showNotification(
                "VOTE ERROR",
                "Unable to change vote.",
                "⚠️"
            );

            return;
        }


    } else {

        const {
            error
        } =
            await supabaseClient
                .from("media_votes")
                .insert({

                    media_id:
                        currentViewerItem.id,

                    user_id:
                        currentUser.id,

                    vote:
                        newVote

                });


        if (error) {

            showNotification(
                "VOTE ERROR",
                "Unable to vote.",
                "⚠️"
            );

            return;
        }
    }


    await refreshViewerVotes();
}

/* =========================================================
   LOAD WALL
   MOST LIKED MEDIA FIRST
========================================================= */

async function loadWall() {

    loading.style.display =
        "block";


    emptyMessage.style.display =
        "none";


    await ensureUser();

    await checkAdmin();


    /* =====================================================
       LOAD MEDIA
    ===================================================== */

    const [
        supabaseMedia,
        githubMedia
    ] =
        await Promise.all([

            loadSupabaseMedia(),

            loadGithubMedia()

        ]);


    /* =====================================================
       MERGE
    ===================================================== */

    allMedia =
        mergeMedia(
            supabaseMedia,
            githubMedia
        );


    /* =====================================================
       GET LIKE COUNTS
    ===================================================== */

    const likeCounts =
        await getAllLikeCounts(
            allMedia
        );


    /* =====================================================
       SORT MOST LIKED FIRST
    ===================================================== */

    allMedia.sort(
        (a, b) => {

            const likesA =
                likeCounts[a.id] || 0;

            const likesB =
                likeCounts[b.id] || 0;


            if (
                likesB !== likesA
            ) {

                return likesB - likesA;
            }


            return Math.random() - 0.5;
        }
    );


    loading.style.display =
        "none";


    /* =====================================================
       EMPTY
    ===================================================== */

    if (
        allMedia.length === 0
    ) {

        wall.innerHTML = "";

        emptyMessage.style.display =
            "block";

        wall.appendChild(
            emptyMessage
        );

        return;
    }


    /* =====================================================
       CREATE COLUMNS
    ===================================================== */

    const columns =
        createColumns();


    /* =====================================================
       BUILD WALL
    ===================================================== */

    for (
        const item of allMedia
    ) {

        const card =
            await createMediaCard(
                item
            );


        const targetColumn =
            getShortestColumn(
                columns
            );


        targetColumn.appendChild(
            card
        );


        const media =
            card.querySelector(
                ".media-content"
            );


        if (media) {

            await waitForMediaLoad(
                media
            );
        }
    }
}


/* =========================================================
   WAIT MEDIA
========================================================= */

function waitForMediaLoad(
    media
) {

    return new Promise(
        resolve => {

            if (
                media.tagName ===
                "IMG"
            ) {

                if (
                    media.complete
                ) {

                    resolve();

                    return;
                }


                media.addEventListener(
                    "load",
                    () => resolve(),
                    {
                        once: true
                    }
                );


                media.addEventListener(
                    "error",
                    () => resolve(),
                    {
                        once: true
                    }
                );


            } else {

                if (
                    media.readyState >= 1
                ) {

                    resolve();

                    return;
                }


                media.addEventListener(
                    "loadedmetadata",
                    () => resolve(),
                    {
                        once: true
                    }
                );


                media.addEventListener(
                    "error",
                    () => resolve(),
                    {
                        once: true
                    }
                );
            }

        }
    );
}

/* =========================================================
   SELECT FILE
========================================================= */

function setSelectedFile(
    file
) {

    const allowedTypes = [

        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp",
        "video/mp4",
        "video/quicktime",
        "video/webm"

    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        uploadStatus.textContent =
            "ERROR: Unsupported media type.";

        uploadStatus.className =
            "upload-status error";

        selectedFile =
            null;

        return;
    }


    selectedFile =
        file;


    selectedFileDisplay.textContent =
        "SELECTED: " +
        file.name +
        " (" +
        formatBytes(file.size) +
        ")";


    uploadStatus.textContent =
        "";

    uploadStatus.className =
        "upload-status";
}

/* =========================================================
   FORMAT BYTES
========================================================= */

function formatBytes(
    bytes
) {

    if (
        bytes === 0
    ) {

        return "0 Bytes";
    }


    const units = [

        "Bytes",
        "KB",
        "MB",
        "GB"

    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (

        parseFloat(

            (
                bytes /
                Math.pow(
                    1024,
                    i
                )
            ).toFixed(2)

        ) +

        " " +

        units[i]
    );
}


/* =========================================================
   UPLOAD
========================================================= */

startUpload.addEventListener(
    "click",
    async () => {

        if (!selectedFile) {

            uploadStatus.textContent =
                "ERROR: Select a media file first.";

            uploadStatus.className =
                "upload-status error";

            return;
        }


        startUpload.disabled =
            true;


        uploadStatus.textContent =
            "UPLOADING TO VAULT...";

        uploadStatus.className =
            "upload-status";


        try {

            await ensureUser();


            if (!currentUser) {

                throw new Error(
                    "Could not authenticate visitor."
                );
            }


            const safeName =
                selectedFile.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


            const uniqueName =
                crypto.randomUUID() +
                "-" +
                safeName;


            const storagePath =
                "uploads/" +
                uniqueName;


            /* STORAGE */

            const {
                data: storageData,
                error: storageError
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .upload(
                        storagePath,
                        selectedFile,
                        {

                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                selectedFile.type
                        }
                    );


            if (
                storageError
            ) {

                throw storageError;
            }


            /* PUBLIC URL */

            const {
                data: publicData
            } =
                supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .getPublicUrl(
                        storagePath
                    );


            const publicUrl =
                publicData.publicUrl;


            /* DATABASE */

            const {
                error: databaseError
            } =
                await supabaseClient
                    .from("media")
                    .insert({

                        filename:
                            selectedFile.name,

                        storage_path:
                            storagePath,

                        public_url:
                            publicUrl,

                        media_type:
                            selectedFile.type,

                        caption:
                            captionInput.value
                                .trim() ||
                            null,

                        uploaded_by:
                            currentUser.id

                    });


            if (
                databaseError
            ) {

                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .remove([
                        storagePath
                    ]);


                throw databaseError;
            }


            /* SUCCESS */

            uploadStatus.textContent =
                "✓ UPLOAD COMPLETE";

            uploadStatus.className =
                "upload-status success";


            selectedFile =
                null;


            fileInput.value =
                "";


            selectedFileDisplay.textContent =
                "";


            captionInput.value =
                "";


            captionCount.textContent =
                "0";


            setTimeout(
                async () => {

                    uploadModal.classList.remove(
                        "active"
                    );

                    await loadWall();

                },
                700
            );


        } catch (error) {

            console.error(
                "Upload failed:",
                error
            );


            uploadStatus.textContent =
                "UPLOAD FAILED: " +
                (
                    error.message ||
                    "Unknown error"
                );


            uploadStatus.className =
                "upload-status error";
        }


        startUpload.disabled =
            false;
    }
);


/* =========================================================
   DELETE MEDIA
========================================================= */

async function deleteMedia(
    item,
    card
) {

    if (!isAdmin) {

        return;
    }


    const confirmed =
        await showConfirm(
            "DELETE MEDIA?",
            "DELETE THIS MEDIA FROM THE VAULT? THIS ACTION CANNOT BE UNDONE.",
            "🗑️"
        );


    if (!confirmed) {

        return;
    }


    try {

        /* STORAGE */

        if (
            item.storage_path
        ) {

            const {
                error: storageError
            } =
                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .remove([
                        item.storage_path
                    ]);


            if (
                storageError
            ) {

                console.error(
                    "Storage delete error:",
                    storageError
                );
            }
        }


        /* VOTES */

        await supabaseClient
            .from("media_votes")
            .delete()
            .eq(
                "media_id",
                item.id
            );


        /* COMMENTS */

        await supabaseClient
            .from("media_comments")
            .delete()
            .eq(
                "media_id",
                item.id
            );


        /* DATABASE */

        const {
            error
        } =
            await supabaseClient
                .from("media")
                .delete()
                .eq(
                    "id",
                    item.id
                );


        if (error) {

            throw error;
        }


        if (
            currentViewerItem &&
            currentViewerItem.id ===
            item.id
        ) {

            closeMediaViewer();
        }


        card.remove();


        showNotification(
            "DELETED",
            "MEDIA HAS BEEN REMOVED FROM THE VAULT.",
            "✓"
        );


    } catch (error) {

        console.error(
            "Delete failed:",
            error
        );


        showNotification(
            "DELETE FAILED",
            "Unable to delete this media.",
            "❌"
        );
    }
}

/* =========================================================
   ADMIN LOGIN
========================================================= */

adminLogin.addEventListener(
    "click",
    async () => {

        const email =
            adminEmail.value.trim();


        const password =
            adminPassword.value;


        if (
            !email ||
            !password
        ) {

            adminStatus.textContent =
                "ENTER EMAIL AND PASSWORD.";

            adminStatus.classList.add(
                "status-error"
            );

            return;
        }


        adminStatus.classList.remove(
            "status-error"
        );


        adminStatus.textContent =
            "AUTHENTICATING...";


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password
                });


        if (error) {

            adminStatus.classList.add(
                "status-error"
            );


            adminStatus.textContent =
                "LOGIN FAILED: " +
                error.message;


            return;
        }


        currentUser =
            data.user;


        const adminResult =
            await checkAdmin();


        if (!adminResult) {

            await supabaseClient
                .auth
                .signOut();


            currentUser =
                null;


            adminStatus.classList.add(
                "status-error"
            );


            adminStatus.textContent =
                "ACCESS DENIED.";

            return;
        }


        adminStatus.textContent =
            "ACCESS GRANTED.";


        setTimeout(
            async () => {

                adminModal.classList.remove(
                    "show"
                );


                await loadWall();


                showNotification(
                    "ADMIN ACCESS",
                    "ADMINISTRATOR MODE IS NOW ACTIVE.",
                    "🔓"
                );

            },
            500
        );
    }
);
