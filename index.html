<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NOWIE VAULT"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>SYSTEM BREACH: NOWIE VAULT</title>


    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html {
            background: #000;
            scroll-behavior: smooth;
        }


        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100vh;

            background: #000;

            color: #ff007f;

            font-family:
                "Courier New",
                Courier,
                monospace;

            overflow-x: hidden;
        }


        /* =========================================================
           SCROLLBAR
        ========================================================= */

        ::-webkit-scrollbar {
            width: 8px;
        }


        ::-webkit-scrollbar-track {
            background: #000;
        }


        ::-webkit-scrollbar-thumb {

            background: #ff007f;

            border-radius: 10px;
        }


        ::-webkit-scrollbar-thumb:hover {
            background: #ff3399;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            padding: 25px 15px;

            text-align: center;

            background:
                rgba(0, 0, 0, 0.96);

            border-bottom:
                3px solid #ff007f;

            box-shadow:
                0 0 20px
                rgba(255, 0, 127, 0.5);
        }


        header h1 {

            margin: 0;

            color: #ff007f;

            font-size:
                clamp(
                    1.4rem,
                    4vw,
                    2.2rem
                );

            font-weight: bold;

            letter-spacing: 5px;

            text-transform: uppercase;

            text-shadow:
                2px 2px 0 #fff;
        }


        header span {

            display: block;

            margin-top: 10px;

            color: #00ff41;

            font-size: 0.9rem;

            font-weight: bold;

            letter-spacing: 1px;
        }


        /* =========================================================
           FILTER BAR
        ========================================================= */

        #filter-bar {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;

            padding: 10px 15px;

            background: #050505;

            border-bottom: 1px solid #222;

            position: sticky;

            top: 101px;

            z-index: 900;
        }


        .filter-button {

            padding: 7px 14px;

            background: #000;

            color: #ff007f;

            border:
                1px solid #ff007f;

            font-family:
                "Courier New",
                Courier,
                monospace;

            font-size: 0.75rem;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                color 0.2s;
        }


        .filter-button:hover {

            background: #ff007f;

            color: #000;
        }


        .filter-button.active {

            background: #ff007f;

            color: #000;
        }


        /* =========================================================
           STATUS BAR
        ========================================================= */

        #status-bar {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 20px;

            padding: 9px 15px;

            background: #050505;

            border-bottom: 1px solid #222;

            text-align: center;

            font-size: 0.75rem;
        }


        #status {
            color: #00ff41;
        }


        #counter {
            color: #ff007f;
        }


        /* =========================================================
           WALL CONTAINER
        ========================================================= */

        #wall-container {

            width: 100%;

            padding: 20px;

            background: #ff007f;
        }


        /* =========================================================
           MASONRY WALL
        ========================================================= */

        #wall {

            display: grid;

            grid-template-columns:
                repeat(
                    var(--columns, 1),
                    minmax(0, 1fr)
                );

            gap: 15px;

            width: 100%;

            align-items: start;
        }


        /* =========================================================
           MASONRY COLUMNS
        ========================================================= */

        .masonry-column {

            display: flex;

            flex-direction: column;

            gap: 15px;

            min-width: 0;
        }


        /* =========================================================
           MEDIA CARD
        ========================================================= */

        .media-link {

            display: block;

            width: 100%;

            margin: 0;

            background: #000;

            border:
                2px solid #000;

            line-height: 0;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease,
                filter 0.3s ease;
        }


        .media-link:hover {

            transform:
                scale(1.03)
                rotate(0.5deg);

            z-index: 5;

            border-color: #fff;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.6);

            filter:
                brightness(1.15);
        }


        /* =========================================================
           MEDIA
        ========================================================= */

        .media-item {

            display: block;

            width: 100%;

            height: auto;

            background: #000;

            object-fit: contain;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            grid-column: 1 / -1;

            width: 100%;

            padding: 60px 20px;

            color: #000;

            text-align: center;

            font-size: 1rem;

            font-weight: bold;
        }


        /* =========================================================
           ERROR
        ========================================================= */

        .error {

            grid-column: 1 / -1;

            width: 100%;

            padding: 60px 20px;

            background: #000;

            color: #fff;

            border:
                2px solid #fff;

            text-align: center;

            line-height: 1.8;
        }


        /* =========================================================
           LIGHTBOX
        ========================================================= */

        #lightbox {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            padding:
                60px 20px 40px;

            background:
                rgba(0, 0, 0, 0.96);
        }


        #lightbox.active {
            display: flex;
        }


        #lightbox-content {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            max-width: 95vw;

            max-height: 85vh;
        }


        #lightbox-content img,
        #lightbox-content video {

            display: block;

            max-width: 90vw;

            max-height: 82vh;

            width: auto;

            height: auto;

            object-fit: contain;

            background: #000;

            box-shadow:
                0 0 30px
                rgba(255, 0, 127, 0.4);
        }


        /* =========================================================
           LIGHTBOX BUTTONS
        ========================================================= */

        .lightbox-button {

            position: absolute;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 50px;

            height: 50px;

            padding: 0;

            background: #000;

            color: #ff007f;

            border:
                2px solid #ff007f;

            font-family:
                "Courier New",
                Courier,
                monospace;

            font-size: 1.5rem;

            cursor: pointer;

            transition:
                background 0.2s,
                color 0.2s;
        }


        .lightbox-button:hover {

            background: #ff007f;

            color: #000;
        }


        #close-lightbox {

            top: 15px;

            right: 15px;
        }


        #previous {

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);
        }


        #next {

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);
        }


        /* =========================================================
           LIGHTBOX INFORMATION
        ========================================================= */

        #lightbox-info {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 10px;

            padding:
                5px 60px;

            color: #00ff41;

            text-align: center;

            font-size: 0.75rem;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            header {

                padding:
                    18px 10px;
            }


            header h1 {

                letter-spacing: 2px;

                font-size: 1.4rem;
            }


            header span {

                font-size: 0.7rem;
            }


            #filter-bar {

                top: 86px;

                gap: 5px;

                padding:
                    7px 5px;
            }


            .filter-button {

                padding:
                    6px 9px;

                font-size:
                    0.65rem;
            }


            #wall-container {

                padding: 10px;
            }


            #wall {

                gap: 10px;
            }


            .masonry-column {

                gap: 10px;
            }


            .media-link {

                margin: 0;
            }


            #previous,
            #next {

                width: 40px;

                height: 40px;

                font-size: 1.2rem;
            }


            #previous {
                left: 5px;
            }


            #next {
                right: 5px;
            }


            #lightbox {

                padding:
                    50px 5px 35px;
            }


            #lightbox-content img,
            #lightbox-content video {

                max-width: 95vw;

                max-height: 80vh;
            }

        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (
            prefers-reduced-motion: reduce
        ) {

            html {
                scroll-behavior: auto;
            }


            *,
            *::before,
            *::after {

                animation: none !important;

                transition: none !important;
            }


            .media-link:hover {
                transform: none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header>

        <h1>
            🚨 SYSTEM BREACH 🚨
        </h1>

        <span>
            DECRYPTING NOWIE VAULT DATA...
            ACCESS GRANTED
        </span>

    </header>


    <!-- =========================================================
         FILTER BAR
    ========================================================= -->

    <nav id="filter-bar">

        <button
            class="filter-button active"
            data-filter="all"
            type="button"
        >
            ALL
        </button>


        <button
            class="filter-button"
            data-filter="image"
            type="button"
        >
            IMAGES
        </button>


        <button
            class="filter-button"
            data-filter="gif"
            type="button"
        >
            GIFS
        </button>


        <button
            class="filter-button"
            data-filter="video"
            type="button"
        >
            VIDEOS
        </button>


        <button
            class="filter-button"
            data-filter="meme"
            type="button"
        >
            MEMES
        </button>


        <button
            class="filter-button"
            data-filter="reaction"
            type="button"
        >
            REACTIONS
        </button>

    </nav>


    <!-- =========================================================
         STATUS
    ========================================================= -->

    <div id="status-bar">

        <div id="status">
            LOADING DATABASE...
        </div>


        <div id="counter">
            0 FILES
        </div>

    </div>


    <!-- =========================================================
         WALL
    ========================================================= -->

    <main id="wall-container">

        <div id="wall">

            <div class="loading">
                ACCESSING VAULT DATABASE...
            </div>

        </div>

    </main>


    <!-- =========================================================
         LIGHTBOX
    ========================================================= -->

    <div
        id="lightbox"
        aria-hidden="true"
    >

        <button
            id="close-lightbox"
            class="lightbox-button"
            aria-label="Close"
            type="button"
        >
            ×
        </button>


        <button
            id="previous"
            class="lightbox-button"
            aria-label="Previous"
            type="button"
        >
            ‹
        </button>


        <div id="lightbox-content"></div>


        <button
            id="next"
            class="lightbox-button"
            aria-label="Next"
            type="button"
        >
            ›
        </button>


        <div id="lightbox-info"></div>

    </div>


    <script>

        /* =========================================================
           CONFIGURATION
        ========================================================= */

        const mediaFolder = "media";

        const mediaDatabase = "media.json";


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const wall =
            document.getElementById("wall");


        const status =
            document.getElementById("status");


        const counter =
            document.getElementById("counter");


        const lightbox =
            document.getElementById("lightbox");


        const lightboxContent =
            document.getElementById(
                "lightbox-content"
            );


        const lightboxInfo =
            document.getElementById(
                "lightbox-info"
            );


        const closeButton =
            document.getElementById(
                "close-lightbox"
            );


        const previousButton =
            document.getElementById(
                "previous"
            );


        const nextButton =
            document.getElementById(
                "next"
            );


        const filterButtons =
            document.querySelectorAll(
                ".filter-button"
            );


        /* =========================================================
           DATA
        ========================================================= */

        let allMedia = [];

        let filteredMedia = [];

        let currentIndex = 0;

        let currentFilter = "all";


        /* =========================================================
           VIDEO OBSERVER
        ========================================================= */

        const videoObserver =
            new IntersectionObserver(

                entries => {

                    entries.forEach(
                        entry => {

                            const video =
                                entry.target;


                            if (
                                entry.isIntersecting
                            ) {

                                video
                                    .play()
                                    .catch(
                                        () => {}
                                    );

                            } else {

                                video.pause();

                            }

                        }
                    );

                },

                {
                    threshold: 0.25
                }

            );


        /* =========================================================
           LOAD DATABASE
        ========================================================= */

        async function loadDatabase() {

            try {

                status.textContent =
                    "LOADING MEDIA DATABASE...";


                const response =
                    await fetch(
                        `${mediaDatabase}?v=${Date.now()}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "media.json could not be loaded."
                    );

                }


                const database =
                    await response.json();


                if (
                    !database.media ||
                    !Array.isArray(
                        database.media
                    )
                ) {

                    throw new Error(
                        "Invalid media.json format."
                    );

                }


                allMedia =
                    database.media.filter(
                        item =>
                            item.file
                    );


                applyFilter("all");


                status.textContent =
                    "DATABASE ONLINE";

            }


            catch (error) {

                console.error(error);


                status.textContent =
                    "DATABASE ERROR";


                counter.textContent =
                    "ERROR";


                wall.innerHTML = `

                    <div class="error">

                        ⚠ DATABASE ERROR

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                        <br><br>

                        Make sure
                        <strong>
                            media.json
                        </strong>
                        exists beside
                        <strong>
                            index.html
                        </strong>.

                    </div>

                `;

            }

        }


        /* =========================================================
           APPLY FILTER
        ========================================================= */

        function applyFilter(filter) {

            currentFilter = filter;


            if (filter === "all") {

                filteredMedia =
                    [...allMedia];

            } else {

                filteredMedia =
                    allMedia.filter(
                        item =>
                            item.category === filter ||
                            item.type === filter
                    );

            }


            counter.textContent =
                `${filteredMedia.length} FILES`;


            renderWall();

        }


        /* =========================================================
           DETERMINE NUMBER OF COLUMNS
        ========================================================= */

        function getColumnCount() {

            const width =
                window.innerWidth;


            if (width <= 500) {
                return 2;
            }


            if (width <= 900) {
                return 3;
            }


            if (width <= 1200) {
                return 4;
            }


            return Math.max(
                1,
                Math.floor(width / 300)
            );

        }


        /* =========================================================
           RENDER MASONRY WALL
        ========================================================= */

        async function renderWall() {

            wall.innerHTML = "";


            if (
                filteredMedia.length === 0
            ) {

                wall.style.setProperty(
                    "--columns",
                    1
                );


                wall.innerHTML = `

                    <div class="error">

                        NO MEDIA FOUND

                        <br><br>

                        FILTER:
                        ${escapeHTML(
                            currentFilter
                        )}

                    </div>

                `;

                return;

            }


            let columnCount =
                getColumnCount();


            columnCount =
                Math.min(
                    columnCount,
                    filteredMedia.length
                );


            wall.style.setProperty(
                "--columns",
                columnCount
            );


            /* =====================================================
               CREATE COLUMNS
            ===================================================== */

            const columns = [];

            const columnHeights = [];


            for (
                let i = 0;
                i < columnCount;
                i++
            ) {

                const column =
                    document.createElement(
                        "div"
                    );


                column.className =
                    "masonry-column";


                wall.appendChild(
                    column
                );


                columns.push(
                    column
                );


                columnHeights.push(0);

            }


            /* =====================================================
               PREPARE MEDIA
            ===================================================== */

            const preparedMedia = [];


            for (
                let index = 0;
                index < filteredMedia.length;
                index++
            ) {

                const file =
                    filteredMedia[index];


                const element =
                    await createMediaElement(
                        file,
                        index
                    );


                /*
                    Estimate the height
                    using the actual media
                    dimensions.
                */

                const estimatedHeight =
                    getEstimatedHeight(
                        element,
                        columnCount
                    );


                preparedMedia.push({

                    element:
                        element,

                    height:
                        estimatedHeight,

                    index:
                        index

                });

            }


            /* =====================================================
               PLACE EACH ITEM IN SHORTEST COLUMN
            ===================================================== */

            preparedMedia.forEach(
                item => {

                    let shortest =
                        0;


                    for (
                        let i = 1;
                        i < columnHeights.length;
                        i++
                    ) {

                        if (
                            columnHeights[i] <
                            columnHeights[shortest]
                        ) {

                            shortest = i;

                        }

                    }


                    columns[shortest]
                        .appendChild(
                            item.element
                        );


                    columnHeights[shortest] +=
                        item.height;

                }
            );


            /*
                Recalculate after images
                have actually loaded.
            */

            requestAnimationFrame(
                () => {

                    rebalanceMasonry();

                }
            );

        }


        /* =========================================================
           CREATE MEDIA ELEMENT
        ========================================================= */

        function createMediaElement(
            file,
            index
        ) {

            return new Promise(
                resolve => {

                    const extension =
                        file.file
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const type =
                        getMediaType(
                            file,
                            extension
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href = "#";

                    link.className =
                        "media-link";


                    link.dataset.index =
                        index;


                    link.addEventListener(
                        "click",
                        event => {

                            event.preventDefault();

                            openLightbox(
                                index
                            );

                        }
                    );


                    let element;


                    /* =================================================
                       VIDEO
                    ================================================= */

                    if (
                        type === "video"
                    ) {

                        element =
                            document.createElement(
                                "video"
                            );


                        element.src =
                            `${mediaFolder}/${encodeURIComponent(
                                file.file
                            )}`;


                        element.muted =
                            true;


                        element.loop =
                            true;


                        element.playsInline =
                            true;


                        element.preload =
                            "metadata";


                        element.className =
                            "media-item";


                        videoObserver.observe(
                            element
                        );


                        element.addEventListener(
                            "loadedmetadata",
                            () => {

                                resolve(link);

                            },

                            {
                                once: true
                            }
                        );


                    }

                    /* =================================================
                       IMAGE
                    ================================================= */

                    else {

                        element =
                            document.createElement(
                                "img"
                            );


                        element.src =
                            `${mediaFolder}/${encodeURIComponent(
                                file.file
                            )}`;


                        element.loading =
                            "lazy";


                        element.decoding =
                            "async";


                        element.alt =
                            file.title ||
                            file.file;


                        element.className =
                            "media-item";


                        element.addEventListener(
                            "load",
                            () => {

                                resolve(link);

                            },

                            {
                                once: true
                            }
                        );

                    }


                    /* =================================================
                       ERROR
                    ================================================= */

                    element.addEventListener(
                        "error",
                        () => {

                            console.warn(
                                "Failed to load:",
                                file.file
                            );


                            resolve(link);

                        },

                        {
                            once: true
                        }
                    );


                    link.appendChild(
                        element
                    );


                    /*
                        If the browser has
                        already loaded the image.
                    */

                    if (
                        element.complete
                    ) {

                        setTimeout(
                            () => resolve(link),
                            0
                        );

                    }

                }
            );

        }


        /* =========================================================
           ESTIMATE MEDIA HEIGHT
        ========================================================= */

        function getEstimatedHeight(
            link,
            columnCount
        ) {

            const media =
                link.querySelector(
                    ".media-item"
                );


            if (!media) {
                return 300;
            }


            let ratio = 1;


            if (
                media.naturalWidth &&
                media.naturalHeight
            ) {

                ratio =
                    media.naturalHeight /
                    media.naturalWidth;

            }


            /*
                Approximate column width.
            */

            const wallWidth =
                wall.clientWidth;


            const gap = 15;


            const columnWidth =
                (
                    wallWidth -
                    (
                        gap *
                        (columnCount - 1)
                    )
                ) /
                columnCount;


            return (
                columnWidth *
                ratio
            ) + 15;

        }


        /* =========================================================
           REBALANCE AFTER LOADING
        ========================================================= */

        function rebalanceMasonry() {

            if (
                filteredMedia.length === 0
            ) {
                return;
            }


            /*
                Rebuild the wall using
                actual rendered heights.
            */

            const items = [];


            document
                .querySelectorAll(
                    ".media-link"
                )
                .forEach(
                    item => {

                        const index =
                            Number(
                                item.dataset.index
                            );


                        items.push({

                            element:
                                item,

                            index:
                                index

                        });

                    }
                );


            if (
                items.length === 0
            ) {
                return;
            }


            const columns =
                Array.from(
                    document.querySelectorAll(
                        ".masonry-column"
                    )
                );


            const heights =
                columns.map(
                    () => 0
                );


            /*
                Remove items.
            */

            columns.forEach(
                column => {

                    column.innerHTML =
                        "";

                }
            );


            /*
                Reinsert items based
                on real dimensions.
            */

            items.forEach(
                item => {

                    let shortest =
                        0;


                    for (
                        let i = 1;
                        i < heights.length;
                        i++
                    ) {

                        if (
                            heights[i] <
                            heights[shortest]
                        ) {

                            shortest = i;

                        }

                    }


                    columns[shortest]
                        .appendChild(
                            item.element
                        );


                    heights[shortest] =
                        columns[shortest]
                            .getBoundingClientRect()
                            .height;

                }
            );

        }


        /* =========================================================
           MEDIA TYPE
        ========================================================= */

        function getMediaType(
            file,
            extension
        ) {

            if (file.type) {
                return file.type;
            }


            if (
                extension === "mp4" ||
                extension === "mov" ||
                extension === "webm"
            ) {

                return "video";

            }


            if (
                extension === "gif"
            ) {

                return "gif";

            }


            return "image";

        }


        /* =========================================================
           LIGHTBOX OPEN
        ========================================================= */

        function openLightbox(index) {

            if (
                index < 0 ||
                index >= filteredMedia.length
            ) {

                return;

            }


            currentIndex =
                index;


            renderLightbox();


            lightbox.classList.add(
                "active"
            );


            lightbox.setAttribute(
                "aria-hidden",
                "false"
            );


            document.body.style.overflow =
                "hidden";

        }


        /* =========================================================
           LIGHTBOX RENDER
        ========================================================= */

        function renderLightbox() {

            const file =
                filteredMedia[
                    currentIndex
                ];


            const extension =
                file.file
                    .split(".")
                    .pop()
                    .toLowerCase();


            const type =
                getMediaType(
                    file,
                    extension
                );


            lightboxContent.innerHTML =
                "";


            let element;


            if (
                type === "video"
            ) {

                element =
                    document.createElement(
                        "video"
                    );


                element.src =
                    `${mediaFolder}/${encodeURIComponent(
                        file.file
                    )}`;


                element.controls =
                    true;


                element.autoplay =
                    true;


                element.loop =
                    true;


                element.muted =
                    true;


                element.playsInline =
                    true;

            }

            else {

                element =
                    document.createElement(
                        "img"
                    );


                element.src =
                    `${mediaFolder}/${encodeURIComponent(
                        file.file
                    )}`;


                element.alt =
                    file.title ||
                    file.file;

            }


            lightboxContent.appendChild(
                element
            );


            lightboxInfo.textContent =
                `${currentIndex + 1} / ${
                    filteredMedia.length
                } — ${
                    file.title ||
                    file.file
                }`;

        }


        /* =========================================================
           CLOSE LIGHTBOX
        ========================================================= */

        function closeLightbox() {

            lightbox.classList.remove(
                "active"
            );


            lightbox.setAttribute(
                "aria-hidden",
                "true"
            );


            lightboxContent.innerHTML =
                "";


            document.body.style.overflow =
                "";

        }


        /* =========================================================
           PREVIOUS
        ========================================================= */

        function previousMedia() {

            if (
                filteredMedia.length === 0
            ) {
                return;
            }


            currentIndex--;


            if (
                currentIndex < 0
            ) {

                currentIndex =
                    filteredMedia.length - 1;

            }


            renderLightbox();

        }


        /* =========================================================
           NEXT
        ========================================================= */

        function nextMedia() {

            if (
                filteredMedia.length === 0
            ) {
                return;
            }


            currentIndex++;


            if (
                currentIndex >=
                filteredMedia.length
            ) {

                currentIndex = 0;

            }


            renderLightbox();

        }


        /* =========================================================
           FILTER BUTTONS
        ========================================================= */

        filterButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        filterButtons.forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        button.classList.add(
                            "active"
                        );


                        applyFilter(
                            button.dataset.filter
                        );

                    }
                );

            }
        );


        /* =========================================================
           LIGHTBOX BUTTONS
        ========================================================= */

        closeButton.addEventListener(
            "click",
            closeLightbox
        );


        previousButton.addEventListener(
            "click",
            previousMedia
        );


        nextButton.addEventListener(
            "click",
            nextMedia
        );


        /* =========================================================
           CLICK OUTSIDE
        ========================================================= */

        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* =========================================================
           KEYBOARD
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    return;
                }


                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    previousMedia();

                }


                if (
                    event.key === "ArrowRight"
                ) {

                    nextMedia();

                }

            }
        );


        /* =========================================================
           WINDOW RESIZE
        ========================================================= */

        let resizeTimer;


        window.addEventListener(
            "resize",
            () => {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        () => {

                            renderWall();

                        },
                        250
                    );

            }
        );


        /* =========================================================
           HTML ESCAPE
        ========================================================= */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* =========================================================
           START
        ========================================================= */

        loadDatabase();

    </script>

</body>

</html>
