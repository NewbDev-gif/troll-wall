<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 SYSTEM BREACH: MEME VAULT 🚨</title>
    <style>
        /* HACKER AESTHETIC */
        body { 
            background: #000; 
            margin: 0; 
            font-family: 'Courier New', monospace; 
            overflow-x: hidden; 
            color: #0f0; 
            cursor: crosshair;
        }
        
        .header { 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background: #ff0000; 
            color: white; 
            text-align: center; 
            padding: 15px; 
            font-weight: bold; 
            font-size: 1.2rem;
            border-bottom: 3px solid white;
            text-shadow: 2px 2px #000;
        }

        /* DYNAMIC GRID */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            grid-auto-rows: 250px;
            grid-auto-flow: dense;
            gap: 10px;
            padding: 20px;
        }

        .media-item { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border: 2px solid #333; 
            transition: transform 0.3s, border-color 0.3s;
            background: #111; /* Loading placeholder color */
        }
        
        .media-item:hover { 
            transform: scale(1.05); 
            border-color: #0f0; 
            z-index: 10; 
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        /* THE TROLL POPUP */
        #popup {
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; 
            padding: 40px; 
            border: 10px solid red; 
            z-index: 9999; 
            text-align: center; 
            color: black; 
            box-shadow: 0 0 100px rgba(255,0,0,1);
            width: 80%; 
            max-width: 400px;
        }

        #run-btn { 
            padding: 15px 25px; 
            font-weight: bold; 
            cursor: pointer; 
            background: red; 
            color: white; 
            border: none; 
            font-size: 1rem;
            border-radius: 5px;
        }

        .error-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #ff4444;
            padding: 50px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body onclick="startPrank()">

    <div class="header">⚠️ WARNING: UNAUTHORIZED ACCESS DETECTED ⚠️</div>

    <div class="container" id="wall">
        <!-- Media will be injected here by JavaScript -->
    </div>

    <!-- Hidden Police Popup -->
    <div id="popup">
        <h1 style="color:red; margin-top:0; font-size: 3rem;">🚨 ERROR 🚨</h1>
        <p style="font-size: 1.2rem; font-weight: bold;">CRITICAL SYSTEM BREACH!</p>
        <p>Your physical location has been broadcast to local authorities.</p>
        <button id="run-btn">CANCEL TRACKING</button>
    </div>

    <script>
        // CONFIGURATION
        const username = 'NewbDev-gif';
        const repo = 'troll-wall';
        const folder = 'media'; // Ensure this matches your GitHub folder name exactly

        async function loadMedia() {
            const wall = document.getElementById('wall');
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

            try {
                console.log("Connecting to GitHub Vault...");
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Access Denied (Status: ${response.status})`);
                }

                const files = await response.json();

                if (files.length === 0) {
                    wall.innerHTML = `<div class="error-msg">VAULT IS EMPTY. Upload files to the /media folder.</div>`;
                    return;
                }

                files.forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let el;

                    // Support for Images
                    if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                        el = document.createElement('img');
                        el.src = file.download_url;
                    } 
                    // Support for Videos
                    else if (['mp4', 'webm', 'mov'].includes(ext)) {
                        el = document.createElement('video');
                        el.src = file.download_url;
                        el.autoplay = true;
                        el.loop = true;
                        el.muted = true;
                        el.setAttribute('playsinline', '');
                    }

                    if (el) {
                        el.className = 'media-item';
                        wall.appendChild(el);
                    }
                });

            } catch (err) {
                console.error("Vault Error:", err);
                wall.innerHTML = `
                    <div class="error-msg">
                        FAILED TO ACCESS VAULT.<br>
                        <small style="color:#666">${err.message}</small><br><br>
                        1. Make sure repo is PUBLIC.<br>
                        2. Check if folder 'media' exists.
                    </div>`;
            }
        }

        // PRANK LOGIC
        let prankStarted = false;
        function startPrank() {
            if (prankStarted) return;
            prankStarted = true;

            // 1. Play Airhorn Sound
            const audio = new Audio('https://www.myinstants.com/media/sounds/mlg-airhorn.mp3');
            audio.play().catch(e => console.log("Audio blocked until interaction"));

            // 2. Show the scary popup
            document.getElementById('popup').style.display = 'block';

            // 3. Make the "Cancel" button run away from the mouse
            const btn = document.getElementById('run-btn');
            
            const moveBtn = (e) => {
                // Prevent actually clicking it
                e.preventDefault();
                
                // Calculate random position within screen bounds
                const x = Math.random() * (window.innerWidth - 200);
                const y = Math.random() * (window.innerHeight - 100);
                
                btn.style.position = 'fixed';
                btn.style.left = x + 'px';
                btn.style.top = y + 'px';
            };

            // Mouse and Touch triggers
            btn.onmouseover = moveBtn;
            btn.ontouchstart = moveBtn;
        }

        // Initialize grid
        loadMedia();
    </script>
</body>
</html>
