<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 SYSTEM BREACH: NOWIE VAULT 🚨</title>
    <style>
        /* THEME: BRIGHT PINK */
        body { 
            background: #ff007f; 
            margin: 0; 
            padding: 0;
            font-family: 'Courier New', monospace; 
            overflow-x: hidden; 
            color: #fff; 
        }

        /* FULL SCREEN MASONRY LAYOUT */
        .container {
            column-count: 4; /* Number of columns for desktop */
            column-gap: 0;   /* No space between columns */
            width: 100vw;
        }

        /* Adjust columns for smaller screens */
        @media (max-width: 1200px) { .container { column-count: 3; } }
        @media (max-width: 800px) { .container { column-count: 2; } }
        @media (max-width: 480px) { .container { column-count: 1; } }

        .media-link {
            display: inline-block;
            width: 100%;
            text-decoration: none;
            overflow: hidden;
            transition: 0.3s;
            line-height: 0; /* Removes tiny gaps at bottom of images */
        }

        .media-link:hover {
            transform: scale(1.02);
            z-index: 5;
            filter: brightness(1.2);
        }

        .media-item { 
            width: 100%; 
            height: auto; /* Adjusts to the natural height of the file */
            display: block;
        }

        /* THE TROLL POPUP */
        #popup {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: white; 
            padding: 40px; border: 15px solid #eee; z-index: 999; 
            text-align: center; color: black; box-shadow: 0 0 100px rgba(0,0,0,0.5);
            width: 80%; max-width: 400px;
        }
        
        #run-btn { 
            padding: 15px 25px; font-weight: bold; cursor: pointer; 
            background: black; color: white; border: none; 
            margin-top: 20px; text-transform: uppercase;
        }
    </style>
</head>
<body onclick="startPrank()">

    <!-- Header removed as requested -->

    <div class="container" id="wall">
        <!-- Content loads here -->
    </div>

    <!-- The Popup -->
    <div id="popup">
        <h1 style="margin-top:0;">POLICE ALERT!</h1>
        <p>Your IP address has been logged. This device is now under surveillance by local authorities.</p>
        <button id="run-btn">CANCEL TRACKING</button>
    </div>

    <script>
        const username = 'NewbDev-gif';
        const repo = 'troll-wall';
        const folder = 'media'; 
        const fbLink = 'https://www.facebook.com/profile.php?id=61575848311942';

        async function loadMedia() {
            const wall = document.getElementById('wall');
            const url = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

            try {
                const response = await fetch(url);
                const files = await response.json();

                files.forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let el;

                    const link = document.createElement('a');
                    link.href = fbLink;
                    link.className = 'media-link';

                    if (['mp4', 'webm', 'mov'].includes(ext)) {
                        el = document.createElement('video');
                        el.src = file.download_url;
                        el.autoplay = true;
                        el.loop = true;
                        el.muted = true;
                        el.setAttribute('playsinline', '');
                    } else if (['jpg', 'png', 'gif', 'webp', 'jpeg'].includes(ext)) {
                        el = document.createElement('img');
                        el.src = file.download_url;
                    }

                    if (el) {
                        el.className = 'media-item';
                        link.appendChild(el);
                        wall.appendChild(link);
                    }
                });
            } catch (err) {
                console.error("API Fetch failed.");
            }
        }

        let prankStarted = false;
        function startPrank() {
            if (prankStarted) return;
            prankStarted = true;

            const audio = new Audio('https://www.myinstants.com/media/sounds/mlg-airhorn.mp3');
            audio.play().catch(() => {});

            document.getElementById('popup').style.display = 'block';

            const btn = document.getElementById('run-btn');
            const moveBtn = (e) => {
                e.preventDefault();
                btn.style.position = 'fixed';
                btn.style.left = Math.random() * 80 + 10 + '%';
                btn.style.top = Math.random() * 80 + 10 + '%';
            };
            btn.onmouseover = btn.ontouchstart = moveBtn;
        }

        loadMedia();
    </script>
</body>
</html>
