<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 SYSTEM BREACH: MEME VAULT 🚨</title>
    <style>
        body { background: #000; margin: 0; font-family: 'Courier New', monospace; overflow-x: hidden; color: #0f0; }
        
        .header { 
            position: sticky; top: 0; z-index: 100; 
            background: red; color: white; text-align: center; 
            padding: 10px; font-weight: bold; border-bottom: 2px solid white;
        }

        /* AUTO-RESIZE & AUTO-ARRANGE GRID */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            grid-auto-rows: 200px;
            grid-auto-flow: dense;
            gap: 8px;
            padding: 8px;
        }

        .media-item { 
            width: 100%; height: 100%; object-fit: cover; 
            border: 1px solid #333; transition: 0.3s; 
        }
        .media-item:hover { transform: scale(1.05); border-color: #0f0; z-index: 10; }

        /* THE TROLL POPUP */
        #popup {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: white; 
            padding: 40px; border: 10px solid red; z-index: 999; 
            text-align: center; color: black; box-shadow: 0 0 50px rgba(255,0,0,0.8);
            width: 80%; max-width: 400px;
        }
        #run-btn { padding: 15px 25px; font-weight: bold; cursor: pointer; background: red; color: white; border: none; }
    </style>
</head>
<body onclick="startPrank()">

    <div class="header">⚠️ WARNING: UNAUTHORIZED DATA VIEWING ⚠️</div>

    <div class="container" id="wall">
        <!-- Content will auto-load here -->
    </div>

    <div id="popup">
        <h1 style="color:red; margin-top:0;">POLICE ALERT!</h1>
        <p>Your IP address has been logged. This device is now under surveillance.</p>
        <button id="run-btn">CANCEL TRACKING</button>
    </div>

    <script>
        // YOUR GITHUB INFO
        const username = 'NewbDev-gif';
        const repo = 'troll-wall';

        async function loadMedia() {
            const wall = document.getElementById('wall');
            // Using your repo's 'media' folder
            const url = `https://api.github.com/repos/${username}/${repo}/contents/media`;

            try {
                const response = await fetch(url);
                const files = await response.json();

                files.forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let el;

                    if (['mp4', 'webm', 'mov'].includes(ext)) {
                        el = document.createElement('video');
                        el.src = file.download_url;
                        el.autoplay = el.loop = el.muted = true;
                        el.setAttribute('playsinline', '');
                    } else if (['jpg', 'png', 'gif', 'webp', 'jpeg'].includes(ext)) {
                        el = document.createElement('img');
                        el.src = file.download_url;
                    }

                    if (el) {
                        el.className = 'media-item';
                        wall.appendChild(el);
                    }
                });
            } catch (err) {
                console.error("Error loading files. Check if 'media' folder exists!", err);
            }
        }

        // PRANK LOGIC
        let prankStarted = false;
        function startPrank() {
            if (prankStarted) return;
            prankStarted = true;

            // MLG Airhorn Sound
            const audio = new Audio('https://www.myinstants.com/media/sounds/mlg-airhorn.mp3');
            audio.play();

            // Show Popup
            document.getElementById('popup').style.display = 'block';

            // Runaway button
            const btn = document.getElementById('run-btn');
            const moveBtn = (e) => {
                e.preventDefault();
                btn.style.position = 'absolute';
                btn.style.left = Math.random() * 80 + '%';
                btn.style.top = Math.random() * 80 + '%';
            };
            btn.onmouseover = btn.ontouchstart = moveBtn;
        }

        loadMedia();
    </script>
</body>
</html>
